[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plateau-tunnel-qa"
version = "0.1.0"
description = "高原铁路隧道科研-施工智能问答系统"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<52",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5.1,<7",
  "pymupdf>=1.25,<2",
  "rapidocr_onnxruntime>=1.2.3,<2",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[tool.setuptools.packages.find]
include = ["tunnel_qa*"]

[tool.setuptools.package-data]
tunnel_qa = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
